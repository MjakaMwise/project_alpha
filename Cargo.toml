[package]
name = "customize"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.7", features = ["fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
dotenvy = "=0.15.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Password hashing is deliberately slow; keep it fast enough in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
